version: '3.9'

# Decentralized Discord - Docker Compose for Pi 5 with Cloud Storage
# This configuration uses:
# - PlanetScale for MySQL database (cloud)
# - NFT.storage for IPFS files (cloud)
# - Local Matrix and IPFS nodes for federation
# - No local persistent storage needed

services:
  # Main Node.js application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: decentralized-discord-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      # Cloud database (PlanetScale)
      DATABASE_URL: ${DATABASE_URL}
      
      # JWT and Auth
      JWT_SECRET: ${JWT_SECRET}
      VITE_APP_ID: ${VITE_APP_ID}
      OAUTH_SERVER_URL: ${OAUTH_SERVER_URL}
      VITE_OAUTH_PORTAL_URL: ${VITE_OAUTH_PORTAL_URL}
      OWNER_OPEN_ID: ${OWNER_OPEN_ID}
      OWNER_NAME: ${OWNER_NAME}
      
      # Manus APIs
      BUILT_IN_FORGE_API_URL: ${BUILT_IN_FORGE_API_URL}
      BUILT_IN_FORGE_API_KEY: ${BUILT_IN_FORGE_API_KEY}
      VITE_FRONTEND_FORGE_API_KEY: ${VITE_FRONTEND_FORGE_API_KEY}
      VITE_FRONTEND_FORGE_API_URL: ${VITE_FRONTEND_FORGE_API_URL}
      
      # App Configuration
      VITE_APP_TITLE: ${VITE_APP_TITLE:-Decentralized Discord}
      VITE_APP_LOGO: ${VITE_APP_LOGO}
      VITE_ANALYTICS_ENDPOINT: ${VITE_ANALYTICS_ENDPOINT}
      VITE_ANALYTICS_WEBSITE_ID: ${VITE_ANALYTICS_WEBSITE_ID}
      
      # Matrix Configuration
      MATRIX_HOMESERVER_URL: ${MATRIX_HOMESERVER_URL:-http://matrix:8008}
      MATRIX_SERVER_NAME: ${MATRIX_SERVER_NAME}
      
      # IPFS Configuration
      IPFS_API_URL: ${IPFS_API_URL:-http://ipfs:5001}
      NFT_STORAGE_API_KEY: ${NFT_STORAGE_API_KEY}
      
      # Web3 Configuration
      REACT_APP_WALLET_CONNECT_PROJECT_ID: ${REACT_APP_WALLET_CONNECT_PROJECT_ID}
    
    depends_on:
      matrix:
        condition: service_started
      ipfs:
        condition: service_started
    
    volumes:
      - ./logs:/app/logs
    
    networks:
      - decentralized-discord
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Matrix Homeserver (Lightweight Conduit)
  # Stores federation data locally, connects to cloud for user data
  matrix:
    image: matrixconduit/matrix-conduit:latest
    container_name: decentralized-discord-matrix
    restart: unless-stopped
    environment:
      CONDUIT_SERVER_NAME: ${MATRIX_SERVER_NAME:-matrix.local}
      CONDUIT_DATABASE_PATH: /var/lib/conduit
      CONDUIT_PORT: 8008
      CONDUIT_ALLOW_REGISTRATION: "true"
      CONDUIT_ALLOW_FEDERATION: "true"
      CONDUIT_LOG: info
      CONDUIT_MAX_CONCURRENT_REQUESTS: 100
    
    volumes:
      - matrix_data:/var/lib/conduit
    
    ports:
      - "8008:8008"
    
    networks:
      - decentralized-discord
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8008/_matrix/client/versions"]
      interval: 30s
      timeout: 10s
      retries: 3

  # IPFS Node (Local)
  # Stores files locally, can pin to NFT.storage for backup
  ipfs:
    image: ipfs/kubo:latest
    container_name: decentralized-discord-ipfs
    restart: unless-stopped
    environment:
      IPFS_PROFILE: server
    
    volumes:
      - ipfs_data:/data/ipfs
      - ipfs_export:/export
    
    ports:
      - "4001:4001/tcp"
      - "4001:4001/udp"
      - "5001:5001"
      - "8080:8080"
    
    networks:
      - decentralized-discord
    
    healthcheck:
      test: ["CMD", "ipfs", "dag", "stat", "QmUNLLsPACCz1vLxQVkXqqLX5R1X345qqfHbsf7ytsQQP"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: decentralized-discord-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - nginx_cache:/var/cache/nginx
    
    depends_on:
      - app
    
    networks:
      - decentralized-discord
    
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  matrix_data:
    driver: local
  ipfs_data:
    driver: local
  ipfs_export:
    driver: local
  nginx_cache:
    driver: local

networks:
  decentralized-discord:
    driver: bridge
