  # The desktop package has its own dependency tree, so it typechecks
  # separately. No Rust here — compiling Tauri on every PR would cost more
  # minutes than it catches bugs; the release build is where that happens.
  desktop:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        working-directory: desktop
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        working-directory: desktop
        run: pnpm check

  # The identity provider is its own service with its own dependencies. Its
  # crypto is tested in the root suite, since shared/identity.ts is what both
  # this service and every server rely on.
  identity:
    needs: changes
    if: needs.changes.outputs.identity == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        working-directory: identity
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        working-directory: identity
        run: pnpm check

  # Version strings live in five files and drift silently. Cheap to check,
  # miserable to discover during a release.
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-versions.sh

  # The single required status check. It always runs, so a site-only pull
  # request can still merge even though the app jobs were skipped — a skipped
  # required check never reports and would block the merge forever.
  ci:
    needs: [app, desktop, identity, versions]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify nothing failed
