name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # A newer push to the same branch makes the older run pointless.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which parts of the repository actually changed. Editing the landing site
  # or a markdown file has no business spinning up Postgres and building the
  # whole application.
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
      desktop: ${{ steps.filter.outputs.desktop }}
      rust: ${{ steps.filter.outputs.rust }}
      identity: ${{ steps.filter.outputs.identity }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app:
              - 'server/**'
              - 'client/**'
              - 'shared/**'
              - 'drizzle/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'tsconfig.json'
              - 'vite.config.ts'
              - 'vitest.config.ts'
              - 'Dockerfile'
              - '.github/workflows/ci.yml'
            desktop:
              - 'desktop/**'
              - 'shared/**'
              - '.github/workflows/ci.yml'
            rust:
              - 'desktop/src-tauri/**'
              - '.github/workflows/ci.yml'
            identity:
              - 'identity/**'
              - 'shared/**'
              - '.github/workflows/ci.yml'

  app:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sovrgnnet_test
          POSTGRES_USER: sovrgn
          POSTGRES_PASSWORD: sovrgn_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sovrgn"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://sovrgn:sovrgn_test@localhost:5432/sovrgnnet_test
      # Account provisioning refuses to run without this, by design — a server
      # that can't prove itself to the homeserver should fail loudly rather
      # than silently create nothing. The integration tests exercise that path.
      MATRIX_SHARED_SECRET: test-shared-secret-for-ci

    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from the packageManager field in package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      - name: Run migrations
        run: pnpm db:push

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  # The desktop package has its own dependency tree, so it typechecks
  # separately. No Rust here — compiling Tauri on every PR would cost more
  # minutes than it catches bugs; the release build is where that happens.
  desktop:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        working-directory: desktop
        run: pnpm install --no-frozen-lockfile

      # `build`, not `check`. Typechecking the desktop proves the types line up;
      # it does not prove the webview bundles. v0.6.1 shipped a shared module
      # that imports node:crypto, which typechecks perfectly and cannot be
      # rolled up for a browser — so the first thing to notice was the release
      # build, on all three platforms, after the tag was already pushed.
      #
      # Same lesson the desktop-rust job below was created for, applied to the
      # half of the shell that is JavaScript.
      - name: Typecheck and bundle
        working-directory: desktop
        run: pnpm build

  # The shell's Rust, checked on push rather than discovered on tag day.
  #
  # This job exists because of v0.5.0: code that only compiles during a
  # release fails during a release. The supervisor (hosting.rs) is real logic
  # with platform-specific branches, so it's checked on both platforms that
  # ship it — cargo check compiles everything and links nothing, which is
  # the cheap end of the certainty it buys.
  desktop-rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev librsvg2-dev libgtk-3-dev \
            libayatana-appindicator3-dev libssl-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: cargo check
        working-directory: desktop/src-tauri
        run: cargo check --locked

  # The identity provider is its own service with its own dependencies. Its
  # crypto is tested in the root suite, since shared/identity.ts is what both
  # this service and every server rely on.
  identity:
    needs: changes
    if: needs.changes.outputs.identity == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        working-directory: identity
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        working-directory: identity
        run: pnpm check

      # The service holds the key that mints tokens for every server that
      # trusts this issuer. It ran in production for a while with no tests of
      # its own — typechecked, never exercised.
      - name: Test
        working-directory: identity
        run: pnpm test

  # Version strings live in five files and drift silently. Cheap to check,
  # miserable to discover during a release.
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-versions.sh

  # The single required status check. It always runs, so a site-only pull
  # request can still merge even though the app jobs were skipped — a skipped
  # required check never reports and would block the merge forever.
  ci:
    needs: [app, desktop, desktop-rust, identity, versions]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify nothing failed
        run: |
          echo "app:          ${{ needs.app.result }}"
          echo "desktop:      ${{ needs.desktop.result }}"
          echo "desktop-rust: ${{ needs.desktop-rust.result }}"
          echo "identity:     ${{ needs.identity.result }}"
          echo "versions:     ${{ needs.versions.result }}"
          for result in "${{ needs.app.result }}" "${{ needs.desktop.result }}" "${{ needs.desktop-rust.result }}" "${{ needs.identity.result }}" "${{ needs.versions.result }}"; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::A required job did not pass."; exit 1 ;;
            esac
          done
