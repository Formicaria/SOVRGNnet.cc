# SOVRGNnet — one stack, your hardware.
#
#   ./install.sh              first-time setup (generates secrets, starts everything)
#   docker compose up -d      start
#   docker compose down       stop
#
# Log rotation is applied per-service so a long-running instance can't fill
# the disk with container logs.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  # Main Node.js application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sovrgnnet-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://sovrgn:${DB_PASSWORD}@db:5432/sovrgnnet
      JWT_SECRET: ${JWT_SECRET}
      VITE_APP_TITLE: ${VITE_APP_TITLE:-SOVRGNnet}
      VITE_APP_LOGO: ${VITE_APP_LOGO}
      VITE_ANALYTICS_ENDPOINT: ${VITE_ANALYTICS_ENDPOINT}
      VITE_ANALYTICS_WEBSITE_ID: ${VITE_ANALYTICS_WEBSITE_ID}
      MATRIX_HOMESERVER_URL: ${MATRIX_HOMESERVER_URL:-http://matrix:8008}
      # Must match CONDUIT_SERVER_NAME below — it becomes the domain in
      # Matrix user IDs (@sovrgn_1:example.com) and the `via` on space links.
      MATRIX_SERVER_NAME: ${MATRIX_SERVER_NAME:-matrix.local}
      # Shared secret that lets the app — and only the app — create Matrix
      # accounts. Public registration on the homeserver is disabled outright.
      MATRIX_SHARED_SECRET: ${MATRIX_SHARED_SECRET:-${MATRIX_REGISTRATION_TOKEN}}
      IPFS_API_URL: ${IPFS_API_URL:-http://ipfs:5001}
      REACT_APP_WALLET_CONNECT_PROJECT_ID: ${REACT_APP_WALLET_CONNECT_PROJECT_ID}
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
      matrix:
        condition: service_started
      ipfs:
        condition: service_started
    volumes:
      - ./logs:/app/logs
    networks:
      - sovrgnnet
    healthcheck:
      # node-based check: curl/wget are not present in the Alpine runtime image
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # PostgreSQL Database (matches the Drizzle/postgres-js code path)
  db:
    image: postgres:16.6-alpine
    container_name: sovrgnnet-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: sovrgnnet
      POSTGRES_USER: sovrgn
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
      # Creates the homeserver's database on first initialisation. Does not
      # run on an existing cluster — see the note in that file.
      - ./dendrite/postgres-init.sql:/docker-entrypoint-initdb.d/10-dendrite.sql:ro
    networks:
      - sovrgnnet
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sovrgn -d sovrgnnet"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Matrix homeserver (Dendrite).
  #
  # Replaced Conduit in v0.3.0 — Conduit ships Linux binaries only, which made
  # bundling a server into the desktop installer impossible on Windows. See
  # docs/adr/0006-dendrite-replaces-conduit.md.
  #
  # Config and signing key are generated by install.sh into ./dendrite/.
  matrix:
    # Pinned: an instance must install identically today and in a year.
    # Upgrades are deliberate — see docs/UPGRADING.md.
    image: ghcr.io/element-hq/dendrite-monolith:v0.15.2
    container_name: sovrgnnet-matrix
    restart: unless-stopped
    command: ["--config", "/etc/dendrite/dendrite.yaml"]
    volumes:
      - ./dendrite/dendrite.yaml:/etc/dendrite/dendrite.yaml:ro
      - ./dendrite/matrix_key.pem:/etc/dendrite/matrix_key.pem:ro
      - matrix_data:/var/lib/dendrite
    ports:
      # Loopback only — the app and tunnel reach the homeserver over the
      # internal Docker network. Exposing 8008 publicly would bypass every
      # app-side membership check.
      - "127.0.0.1:8008:8008"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sovrgnnet
    logging: *default-logging
    healthcheck:
      test:
        - "CMD"
        - "wget"
        - "--quiet"
        - "--tries=1"
        - "--spider"
        - "http://localhost:8008/_matrix/client/versions"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # IPFS Node
  ipfs:
    image: ipfs/kubo:v0.43.0
    container_name: sovrgnnet-ipfs
    restart: unless-stopped
    environment:
      IPFS_PROFILE: server
    volumes:
      - ipfs_data:/data/ipfs
      - ipfs_export:/export
    ports:
      # Swarm port is public — that's how your node peers with IPFS.
      - "4001:4001/tcp"
      - "4001:4001/udp"
      # API (5001) and gateway (8080) are loopback only. Port 5001 is an
      # unauthenticated admin API: anyone who can reach it controls the node.
      - "127.0.0.1:5001:5001"
      - "127.0.0.1:8080:8080"
    networks:
      - sovrgnnet
    logging: *default-logging
    healthcheck:
      test: ["CMD", "ipfs", "dag", "stat", "QmUNLLsPACCz1vLxQVkXqqLX5R1X345qqfHbsf7ytsQQP"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Cloudflare Tunnel — outbound-only ingress, no forwarded ports.
  # Runs only when started with: docker compose --profile tunnel up -d
  cloudflared:
    image: cloudflare/cloudflared:2024.12.2
    container_name: sovrgnnet-tunnel
    restart: unless-stopped
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - sovrgnnet
    logging: *default-logging

  # Cloudflare Quick Tunnel — a public https:// link with no account, no
  # domain, and no port forwarding. The address is random and changes on
  # restart, which is exactly the tradeoff for needing nothing at all.
  # Runs only when started with: docker compose --profile quick up -d
  cloudflared-quick:
    image: cloudflare/cloudflared:2024.12.2
    container_name: sovrgnnet-quicktunnel
    restart: unless-stopped
    profiles: ["quick"]
    command: tunnel --no-autoupdate --url http://app:3000
    depends_on:
      - app
    networks:
      - sovrgnnet
    logging: *default-logging

  # Nginx reverse proxy — only needed when you terminate TLS yourself or want
  # everything on port 80/443. With the Cloudflare tunnel it's redundant.
  # Runs only when started with: docker compose --profile proxy up -d
  nginx:
    image: nginx:1.27-alpine
    container_name: sovrgnnet-nginx
    restart: unless-stopped
    profiles: ["proxy"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - nginx_cache:/var/cache/nginx
    depends_on:
      - app
    networks:
      - sovrgnnet
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  db_data:
    driver: local
  matrix_data:
    driver: local
  ipfs_data:
    driver: local
  ipfs_export:
    driver: local
  nginx_cache:
    driver: local

networks:
  sovrgnnet:
    driver: bridge
