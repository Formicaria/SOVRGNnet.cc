<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <!-- Served from public/ rather than imported: the browser asks for this
         before any bundle exists. Same mark the desktop icons are generated
         from. There was no favicon at all until now, so browsers fell back to
         guessing at /favicon.ico and getting the SPA's index.html. -->
    <link rel="icon" type="image/png" href="/mark.png" />
    <!-- Add-to-home-screen on phones. No service worker on purpose: offline
         chat against a live homeserver would be a cache of stale messages
         pretending to be a conversation, and installability doesn't need one. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/mark.png" />
    <meta name="theme-color" content="#05040a" />
    <title>SOVRGN</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>

</html>
