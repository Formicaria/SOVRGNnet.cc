# Overrides for the end-to-end harness.
#
#   docker compose -f docker-compose.yml -f docker-compose.e2e.yml -p sovrgnnet-e2e ...
#
# Used only by scripts/e2e.sh. Kept as an override rather than folded into the
# real compose file so that what the harness exercises is the actual production
# topology, with only the differences a test needs stated explicitly here.

services:
  app:
    # A different port, so running the harness never collides with a real
    # instance already listening on 3000.
    ports: !override
      - "${E2E_PORT:-3999}:3000"
    environment:
      # The main compose file doesn't pass these through, so a Docker install
      # can only set instance identity through the settings UI after first
      # boot. The harness needs them at startup to assert that the advertised
      # join policy is actually enforced.
      INSTANCE_NAME: ${INSTANCE_NAME:-E2E instance}
      INSTANCE_JOIN_POLICY: ${INSTANCE_JOIN_POLICY:-invite}
    # A crash should fail the run, not be quietly papered over by a restart.
    restart: "no"

  db:
    restart: "no"

  matrix:
    restart: "no"
    ports: !override
      # The base file binds this to 127.0.0.1 so the homeserver is reachable
      # only from the host, and never from the LAN — exposing 8008 publicly
      # bypasses every app-side membership check. That stays right for a real
      # install and is deliberately relaxed here, for one reason.
      #
      # `MATRIX_PUBLIC_URL` is one variable read by two consumers with
      # different views of the network: the app container, which probes it to
      # decide `clientMatrix`, and the browser, which makes every homeserver
      # request against it. `http://matrix:8008` satisfies the first and is
      # unresolvable to the second; `http://127.0.0.1:8008` satisfies the
      # second and is the container itself to the first. A host address
      # published on all interfaces is reachable from both, which is the only
      # value that lets the browser stage exercise the client's view at all.
      #
      # This is a test stack holding disposable accounts for the length of one
      # run. It is not a pattern to copy into a deployment.
      - "8008:8008"
    volumes:
      # Appended to the main file's mounts (compose merges volume lists).
      - ./dendrite/appservice-e2e.yaml:/etc/dendrite/appservice-e2e.yaml:ro

  ipfs:
    restart: "no"
