name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  # The version in the tag and the version in the repository must agree, or
  # you ship installers named one thing that report another. Cheapest possible
  # gate, and it runs before anything expensive.
  guard:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          ./scripts/check-versions.sh
          FILE="$(node -e "process.stdout.write(require('./package.json').version)")"
          if [ "$TAG" != "$FILE" ]; then
            echo "::error::Tag v$TAG doesn't match package.json ($FILE). Run ./scripts/bump-version.sh $TAG first."
            exit 1
          fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

  # Created up front and left as a draft so the platform builds have somewhere
  # to upload to, and so a half-finished release is never publicly visible.
  draft:
    needs: guard
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.create.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - id: create
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: v${{ needs.guard.outputs.version }}
          generate_release_notes: true

  desktop:
    needs: [guard, draft]
    strategy:
      # One platform failing shouldn't throw away the others' build minutes.
      fail-fast: false
      matrix:
        include:
          # 22.04, not latest: binaries link against the runner's glibc, and
          # building on a newer Ubuntu produces packages that refuse to start
          # on older but perfectly current distributions.
          - platform: ubuntu-22.04
            args: ""
            required: true
          # macOS compiles fine but bundle_dmg.sh fails on the runner, and
          # nobody here has a Mac to debug it on. Marked optional so a broken
          # DMG degrades the release to Linux + Windows rather than blocking
          # it entirely. Make it required again once it's been made to work.
          - platform: macos-latest
            args: "--target universal-apple-darwin"
            required: false
          - platform: windows-latest
            args: ""
            required: true

    runs-on: ${{ matrix.platform }}
    continue-on-error: ${{ !matrix.required }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          # libappindicator3-dev and libayatana-appindicator3-dev conflict with
          # each other — ayatana is the maintained one and what Tauri 2 wants.
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev librsvg2-dev libgtk-3-dev \
            libayatana-appindicator3-dev \
            patchelf build-essential curl wget file libssl-dev

      - name: Install
        working-directory: desktop
        run: pnpm install --no-frozen-lockfile

      # ---- the hosted server (ADR 0005) ------------------------------------
      # Linux and Windows installers ship a complete server: Postgres, the
      # homeserver, Kubo, a Node runtime, and the app as one bundle, all
      # supervised by the shell. macOS ships client-only for now — the panel
      # in the app says so rather than pretending.
      - uses: actions/setup-go@v5
        if: matrix.platform != 'macos-latest'
        with:
          go-version: "1.23"
          cache: false

      - name: Root install (host bundle build)
        if: matrix.platform != 'macos-latest'
        run: pnpm install --frozen-lockfile

      - name: Assemble host components
        if: matrix.platform != 'macos-latest'
        shell: bash
        run: |
          ./scripts/host-bundle.sh \
            ${{ matrix.platform == 'windows-latest' && 'windows-x64' || 'linux-x64' }}

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # bundle_dmg.sh drives Finder with AppleScript to arrange the disk
          # image window. There's no Finder on a CI runner, so it hangs or
          # fails; CI=true makes it skip the cosmetics and just build the DMG.
          CI: true
        with:
          projectPath: desktop
          releaseId: ${{ needs.draft.outputs.id }}
          args: ${{ matrix.args }}

  # The server image. This is what people actually run; the desktop apps are
  # clients for it.
  #
  # Each architecture builds on hardware that actually is that architecture.
  # It was one QEMU-emulated buildx job, and Node under qemu-user dies with
  # SIGILL partway through pnpm install — v0.5.1's image build proved it.
  # Native arm64 runners are free for public repositories, so emulation buys
  # nothing but the crash. Each build pushes by digest; the manifest job
  # stitches them into one tag afterwards.
  server:
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR names must be lowercase; ${{ github.repository }} isn't. The
      # metadata action used to hide this by lowercasing internally — done
      # explicitly here because the digest push and manifest need the same
      # exact string.
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # No tag here on purpose: pushing by digest lets the manifest job
          # own the tags, so the two halves become one image atomically
          # rather than the last-pushed architecture winning.
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Record digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # One tag, both architectures, created only after both builds exist.
  server-manifest:
    needs: [guard, server]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the multi-arch manifest
        working-directory: /tmp/digests
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          VERSION="${{ needs.guard.outputs.version }}"
          MAJOR_MINOR="${VERSION%.*}"
          docker buildx imagetools create \
            -t "$IMAGE:$VERSION" \
            -t "$IMAGE:$MAJOR_MINOR" \
            -t "$IMAGE:latest" \
            $(printf "$IMAGE@sha256:%s " *)

      - name: Verify both architectures answer to the tag
        run: |
          docker buildx imagetools inspect \
            "ghcr.io/${GITHUB_REPOSITORY,,}:${{ needs.guard.outputs.version }}" | tee /tmp/inspect
          grep -q "linux/amd64" /tmp/inspect || { echo "::error::amd64 missing from the manifest"; exit 1; }
          grep -q "linux/arm64" /tmp/inspect || { echo "::error::arm64 missing from the manifest"; exit 1; }

  # Only once every platform and the image are done. Until this runs, the
  # release is a draft nobody can download half of.
  publish:
    needs: [guard, draft, desktop, server-manifest]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          draft: false
          name: v${{ needs.guard.outputs.version }}
          body: |
            ## Install a server

            ```bash
            git clone https://github.com/${{ github.repository }}.git sovrgnnet
            cd sovrgnnet && ./install.sh
            ```

            No Docker? `scripts/install-lxc.sh` installs everything as systemd
            services. Already running one? `sovrgnnet update`.

            Container image: `ghcr.io/formicaria/sovrgnnet.cc:${{ needs.guard.outputs.version }}`

            ## Desktop apps

            Attached below for Linux, macOS, and Windows. The desktop client
            connects to servers other people run — it is not required to use a
            SOVRGNnet server, which works in any browser.

            **The Linux and Windows installers can also host.** "Run a server
            on this computer" sets up a complete instance — database,
            homeserver, file storage — under your user account, no terminal
            involved. It runs while the app is open, and friends join with an
            invite. macOS installs are client-only for now.

            **Channels are end-to-end encrypted by default** on instances
            whose deployment can support it — a reachable homeserver and a
            wired appservice. Keys live on members' devices and the server
            stores ciphertext it cannot read. Where the deployment can't
            support it (a loopback-only install), channels are plaintext and
            the instance says so rather than pretending. The limits — visible
            metadata chief among them — are stated plainly in `SECURITY.md`.
          generate_release_notes: true
