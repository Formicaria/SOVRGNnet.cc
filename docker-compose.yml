version: '3.9'

services:
  # Main Node.js application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: decentralized-discord-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://sovrgn:${DB_PASSWORD}@db:5432/sovrgnnet
      JWT_SECRET: ${JWT_SECRET}
      VITE_APP_ID: ${VITE_APP_ID}
      OAUTH_SERVER_URL: ${OAUTH_SERVER_URL}
      VITE_OAUTH_PORTAL_URL: ${VITE_OAUTH_PORTAL_URL}
      OWNER_OPEN_ID: ${OWNER_OPEN_ID}
      OWNER_NAME: ${OWNER_NAME}
      BUILT_IN_FORGE_API_URL: ${BUILT_IN_FORGE_API_URL}
      BUILT_IN_FORGE_API_KEY: ${BUILT_IN_FORGE_API_KEY}
      VITE_FRONTEND_FORGE_API_KEY: ${VITE_FRONTEND_FORGE_API_KEY}
      VITE_FRONTEND_FORGE_API_URL: ${VITE_FRONTEND_FORGE_API_URL}
      VITE_APP_TITLE: ${VITE_APP_TITLE:-SOVRGNnet}
      VITE_APP_LOGO: ${VITE_APP_LOGO}
      VITE_ANALYTICS_ENDPOINT: ${VITE_ANALYTICS_ENDPOINT}
      VITE_ANALYTICS_WEBSITE_ID: ${VITE_ANALYTICS_WEBSITE_ID}
      MATRIX_HOMESERVER_URL: ${MATRIX_HOMESERVER_URL:-http://matrix:8008}
      IPFS_API_URL: ${IPFS_API_URL:-http://ipfs:5001}
      REACT_APP_WALLET_CONNECT_PROJECT_ID: ${REACT_APP_WALLET_CONNECT_PROJECT_ID}
    depends_on:
      db:
        condition: service_healthy
      matrix:
        condition: service_started
      ipfs:
        condition: service_started
    volumes:
      - ./logs:/app/logs
    networks:
      - decentralized-discord
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # PostgreSQL Database (matches the Drizzle/postgres-js code path)
  db:
    image: postgres:16-alpine
    container_name: sovrgnnet-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: sovrgnnet
      POSTGRES_USER: sovrgn
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - decentralized-discord
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sovrgn -d sovrgnnet"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Matrix Homeserver (Conduit - lightweight)
  matrix:
    image: matrixconduit/matrix-conduit:latest
    container_name: decentralized-discord-matrix
    restart: unless-stopped
    environment:
      CONDUIT_SERVER_NAME: ${MATRIX_SERVER_NAME:-matrix.local}
      CONDUIT_DATABASE_PATH: /var/lib/conduit
      CONDUIT_PORT: 8008
      CONDUIT_ALLOW_REGISTRATION: "true"
      CONDUIT_ALLOW_FEDERATION: "true"
      CONDUIT_LOG: info
      CONDUIT_MAX_CONCURRENT_REQUESTS: 100
    volumes:
      - matrix_data:/var/lib/conduit
    ports:
      - "8008:8008"
    networks:
      - decentralized-discord
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8008/_matrix/client/versions"]
      interval: 30s
      timeout: 10s
      retries: 3

  # IPFS Node
  ipfs:
    image: ipfs/kubo:latest
    container_name: decentralized-discord-ipfs
    restart: unless-stopped
    environment:
      IPFS_PROFILE: server
    volumes:
      - ipfs_data:/data/ipfs
      - ipfs_export:/export
    ports:
      - "4001:4001/tcp"
      - "4001:4001/udp"
      - "5001:5001"
      - "8080:8080"
    networks:
      - decentralized-discord
    healthcheck:
      test: ["CMD", "ipfs", "dag", "stat", "QmUNLLsPACCz1vLxQVkXqqLX5R1X345qqfHbsf7ytsQQP"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx Reverse Proxy (optional but recommended)
  nginx:
    image: nginx:alpine
    container_name: decentralized-discord-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - nginx_cache:/var/cache/nginx
    depends_on:
      - app
    networks:
      - decentralized-discord
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  db_data:
    driver: local
  matrix_data:
    driver: local
  ipfs_data:
    driver: local
  ipfs_export:
    driver: local
  nginx_cache:
    driver: local

networks:
  decentralized-discord:
    driver: bridge
