name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sovrgnnet_test
          POSTGRES_USER: sovrgn
          POSTGRES_PASSWORD: sovrgn_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sovrgn"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://sovrgn:sovrgn_test@localhost:5432/sovrgnnet_test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      - name: Run migrations
        run: pnpm db:push

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
