          echo "app:      ${{ needs.app.result }}"
          echo "desktop:  ${{ needs.desktop.result }}"
          echo "identity: ${{ needs.identity.result }}"
          echo "versions: ${{ needs.versions.result }}"
          for result in "${{ needs.app.result }}" "${{ needs.desktop.result }}" "${{ needs.identity.result }}" "${{ needs.versions.result }}"; do
