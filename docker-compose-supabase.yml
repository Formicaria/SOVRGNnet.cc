version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: discord-app
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      # Database (Supabase hosted)
      DATABASE_URL: ${DATABASE_URL}
      # Matrix
      VITE_MATRIX_HOMESERVER_URL: ${VITE_MATRIX_HOMESERVER_URL:-http://matrix:8008}
      # IPFS
      VITE_IPFS_GATEWAY: ${VITE_IPFS_GATEWAY:-https://gateway.pinata.cloud/ipfs}
      VITE_IPFS_API_URL: ${VITE_IPFS_API_URL:-http://ipfs:5001}
      # Web3
      VITE_WALLET_CONNECT_PROJECT_ID: ${VITE_WALLET_CONNECT_PROJECT_ID}
      # Supabase
      VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
      VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
      # Auth
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - matrix
      - ipfs
    networks:
      - discord-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  matrix:
    image: matrixdotorg/synapse:latest
    container_name: discord-matrix
    ports:
      - "8008:8008"
      - "8448:8448"
    environment:
      SYNAPSE_SERVER_NAME: matrix.local
      SYNAPSE_REPORT_STATS: "no"
      SYNAPSE_LOG_LEVEL: INFO
    volumes:
      - matrix-data:/data
    networks:
      - discord-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8008/_synapse/admin/v1/server_version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  ipfs:
    image: ipfs/go-ipfs:latest
    container_name: discord-ipfs
    ports:
      - "4001:4001"
      - "5001:5001"
      - "8080:8080"
    environment:
      IPFS_PROFILE: server
    volumes:
      - ipfs-data:/data/ipfs
    networks:
      - discord-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ipfs", "id"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  matrix-data:
    driver: local
  ipfs-data:
    driver: local

networks:
  discord-network:
    driver: bridge
